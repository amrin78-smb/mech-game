ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // Kotlin folded the jdk7/jdk8 stdlib artifacts into kotlin-stdlib at 1.8.
    // A transitive dependency still asks for 1.6.21 of them, which duplicates
    // every one of those classes and fails the build. Pinning all three to one
    // version makes the jdk7/jdk8 jars the empty shims they are meant to be.
    kotlinVersion = '1.8.22'
}